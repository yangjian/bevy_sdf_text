[package]
name = "bevy_sdf_text"
version = "0.1.0"
edition = "2021"
description = "Text rendering for Bevy using Multi-Channel Signed Distance Field"
license = "MIT OR Apache-2.0"

[[bin]]
name = "bevy_sdf_text_writer"
path = "src/bin/writer.rs"
required-features = ["writer"]

[dependencies]
anyhow = "1.0.72"
ab_glyph = "0.2.22"
bevy = { version = "0.15.2", default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_pbr",
    "bevy_asset",
    "bevy_text",
] }
glyph_brush_layout = "0.2.3"
image = { version = "0.25.6", default-features = false, features = ["png"] }
ttf-parser = "0.18.1"
owned_ttf_parser = "0.18.1"
thiserror = "1.0.44"
serde = "1.0"
rmp-serde = "1.3.0"

# optional dependency for jar builder; not required for rendering
msdfgen = { version = "0.2.1", optional = true, default-features = false, features = [
    "ttf-parser",
    "png",
] }
clap = { version = "4.5.26", features = ["derive"], optional = true }
env_logger = { version = "0.11.6", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
bevy = { version = "0.15.2", default-features = false, features = [
    "bevy_winit",
    "multi_threaded",
] }
bevy_egui = "0.32.0"
bevy_panorbit_camera = { version = "0.22.2", features = ["bevy_egui"] }

[features]
default = []
writer = ["dep:msdfgen", "dep:clap", "dep:env_logger", "dep:log"]

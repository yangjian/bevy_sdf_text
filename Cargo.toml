[package]
name = "bevy-sdf-text"
version = "0.1.0"
edition = "2021"
description = "Multi-Channel Signed Distance Field Rendering for Bevy"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.72"
ab_glyph = "0.2.6"
bevy = { version = "0.11.0", default-features = false, features = ["bevy_core_pipeline", "bevy_render", "bevy_pbr", "bevy_asset"] }
glyph_brush_layout = "0.2.1"
msdfgen = { version = "0.2.1", default-features = false, features = ["ttf-parser", "png"] }
ttf-parser = "0.18.1"
thiserror = "1.0.44"

[dev-dependencies]
bevy = { version = "0.11.0", default-features = false, features = ["bevy_winit", "x11", "zstd"] }
bevy_panorbit_camera = { version = "0.6.0", features = ["bevy_egui"] }

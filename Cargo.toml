[package]
name = "bevy_sdf_text"
version = "0.1.0"
edition = "2021"
description = "Text rendering for Bevy using Multi-Channel Signed Distance Field"
license = "MIT OR Apache-2.0"

[[bin]]
name = "bevy_sdf_text_writer"
path = "src/bin/writer.rs"
required-features = ["writer"]

[dependencies]
anyhow = "1.0.72"
ab_glyph = "0.2.32"
bevy = { version = "0.19.0", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_pbr",
    "bevy_asset",
    "bevy_text",
    "bevy_log",
    "bevy_light",
    "bevy_shader",
] }
glyph_brush_layout = "0.2.4"
image = { version = "0.25.8", default-features = false, features = ["png"] }
ttf-parser = "0.25.1"
owned_ttf_parser = "0.25.1"
thiserror = "2.0.17"
serde = "1.0"
rmp-serde = "1.3.0"

# optional dependency for jar builder; not required for rendering
msdfgen = { version = "0.2.1", optional = true, default-features = false, features = [
    "ttf-parser",
    "png",
] }
clap = { version = "4.5.26", features = ["derive"], optional = true }
env_logger = { version = "0.11.6", optional = true }
log = { version = "0.4", optional = true }
svg = { version = "0.18.0", optional = true }
ttf-parser-msdf = { package = "ttf-parser", version = "0.18", optional = true }

[dev-dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "bevy_anti_alias",
    "bevy_picking",
    "bevy_post_process",
    "bevy_winit",
    "multi_threaded",
] }
bevy_egui = "0.40.0"
bevy_panorbit_camera = { version = "0.35.0", features = ["bevy_egui"] }

[features]
default = []
writer = [
    "dep:msdfgen",
    "dep:clap",
    "dep:env_logger",
    "dep:log",
    "dep:svg",
    "dep:ttf-parser-msdf",
]
